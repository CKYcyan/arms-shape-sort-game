<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>海洋生物分類小遊戲 v3</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
      background: linear-gradient(160deg, #001f3f 0%, #003566 50%, #005f73 100%);
      min-height: 100vh;
      color: #fff;
      overflow-x: hidden;
    }

    /* ── 畫面切換 ── */
    .screen { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .screen.active { display: flex; }

    /* ══ 開場畫面 ══ */
    #screen-start { text-align: center; gap: 22px; }
    #screen-start h1 {
      font-size: clamp(2rem, 5vw, 3.2rem); letter-spacing: 4px;
      background: linear-gradient(90deg, #48cae4, #90e0ef, #48cae4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    #screen-start .subtitle { font-size: 1rem; color: #90e0ef; letter-spacing: 2px; }
    #screen-start p { font-size: clamp(0.95rem, 2.5vw, 1.15rem); color: #caf0f8; max-width: 500px; line-height: 1.9; }
    .start-previews { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin: 4px 0; }
    .start-previews svg { filter: drop-shadow(0 4px 14px rgba(72,202,228,0.45)); }
    .btn-start {
      padding: 15px 48px; font-size: 1.25rem; border: none; border-radius: 50px;
      background: linear-gradient(90deg, #0077b6, #00b4d8);
      color: #fff; cursor: pointer; letter-spacing: 2px; font-weight: bold;
      box-shadow: 0 8px 28px rgba(0,119,182,0.5);
      transition: transform .2s, box-shadow .2s;
    }
    .btn-start:hover { transform: scale(1.06); box-shadow: 0 12px 38px rgba(0,180,216,0.65); }

    /* ══ 遊戲畫面 ══ */
    #screen-game { justify-content: flex-start; padding: 16px 20px 24px; gap: 14px; }

    .game-header { width: 100%; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .game-title { font-size: 1.25rem; font-weight: bold; color: #90e0ef; letter-spacing: 2px; }
    .progress-info { font-size: 1rem; color: #48cae4; }

    /* 待分類區 */
    .items-panel {
      width: 100%; background: rgba(0,180,216,0.05);
      border: 2px dashed rgba(72,202,228,0.3);
      border-radius: 20px; padding: 18px;
      display: flex; flex-wrap: wrap; gap: 14px;
      justify-content: center; align-items: flex-end;
      min-height: 130px;
    }
    .items-panel-label { width: 100%; text-align: center; font-size: 0.85rem; color: rgba(255,255,255,0.35); margin-bottom: -6px; }

    /* 分類框 */
    .drop-zones { width: 100%; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .drop-zone {
      flex: 1 1 150px; max-width: 190px; min-height: 140px;
      border: 3px dashed rgba(255,255,255,0.22);
      border-radius: 18px; padding: 10px 8px 8px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      transition: background .25s, border-color .25s, transform .15s;
    }
    .drop-zone .zone-label {
      font-size: 0.9rem; font-weight: bold; letter-spacing: 1px;
      padding: 4px 12px; border-radius: 50px;
      background: rgba(255,255,255,0.1); color: #fff;
      white-space: nowrap;
    }
    .drop-zone .zone-content { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .drop-zone.drag-over { background: rgba(72,202,228,0.1); border-color: #48cae4; transform: scale(1.03); }

    /* 生物卡片 */
    .shape-item {
      width: 80px; height: 92px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px;
      cursor: grab; border-radius: 14px;
      background: rgba(255,255,255,0.07);
      border: 2px solid rgba(255,255,255,0.14);
      transition: transform .15s, box-shadow .15s;
      touch-action: none;
      user-select: none;
    }
    .shape-item:hover { transform: scale(1.1); box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
    .shape-item.dragging { opacity: 0.35; transform: scale(0.95); }
    .shape-item svg { pointer-events: none; }
    .shape-item .shape-label {
      font-size: 0.68rem; color: #90e0ef; text-align: center;
      pointer-events: none; line-height: 1.2; padding: 0 4px;
    }

    /* 在分類框內縮小並隱藏名稱 */
    .drop-zone .shape-item { width: 54px; height: 54px; }
    .drop-zone .shape-item svg { width: 38px; height: 38px; }
    .drop-zone .shape-item .shape-label { display: none; }

    /* 送出按鈕 */
    .btn-submit {
      padding: 13px 40px; font-size: 1.1rem; border: none; border-radius: 50px;
      background: linear-gradient(90deg, #43e97b, #38f9d7);
      color: #001f3f; cursor: pointer; font-weight: bold; letter-spacing: 2px;
      box-shadow: 0 6px 22px rgba(67,233,123,0.3);
      transition: transform .2s, box-shadow .2s, opacity .2s;
    }
    .btn-submit:disabled { opacity: .38; cursor: not-allowed; transform: none; }
    .btn-submit:not(:disabled):hover { transform: scale(1.05); box-shadow: 0 10px 28px rgba(67,233,123,0.5); }

    /* ══ 結果畫面 ══ */
    #screen-result { gap: 20px; padding: 32px 20px; }
    .result-score-big {
      font-size: clamp(4rem, 12vw, 6.5rem); font-weight: 900;
      background: linear-gradient(90deg, #43e97b, #38f9d7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      line-height: 1; text-align: center;
    }
    .result-subtitle { font-size: 1.25rem; color: #90e0ef; text-align: center; }
    .result-list { width: 100%; max-width: 620px; display: flex; flex-direction: column; gap: 9px; }
    .result-row {
      display: flex; align-items: flex-start; gap: 12px;
      background: rgba(255,255,255,0.06); border-radius: 14px;
      padding: 10px 14px; border: 2px solid transparent;
    }
    .result-row.correct { border-color: #43e97b; }
    .result-row.wrong   { border-color: #e94560; }
    .result-row .r-icon { font-size: 1.2rem; padding-top: 3px; flex-shrink: 0; }
    .result-row .r-svg  { flex-shrink: 0; }
    .result-row .r-info { flex: 1; min-width: 0; }
    .result-row .r-name { font-size: 0.95rem; font-weight: bold; }
    .result-row .r-desc { font-size: 0.78rem; color: rgba(255,255,255,0.55); line-height: 1.55; margin-top: 3px; }
    .result-row .r-ans  { font-size: 0.82rem; color: rgba(255,255,255,0.5); text-align: right; flex-shrink: 0; padding-top: 3px; }
    .result-row.wrong .r-ans { color: #ff8fa0; }
    .result-msg { font-size: 1rem; color: #48cae4; max-width: 440px; line-height: 1.75; text-align: center; }
    .btn-restart {
      padding: 13px 40px; font-size: 1.05rem; border: none; border-radius: 50px;
      background: linear-gradient(90deg, #0077b6, #00b4d8);
      color: #fff; cursor: pointer; font-weight: bold; letter-spacing: 2px;
      transition: transform .2s;
    }
    .btn-restart:hover { transform: scale(1.05); }

    /* ── ghost ── */
    #drag-ghost {
      position: fixed; pointer-events: none; z-index: 9999;
      opacity: 0.88; transform: scale(1.12);
      display: none;
    }

    /* ── 生物圖片（Drive 圖片取代 SVG 時使用）── */
    .shape-item .shape-img {
      width: 56px; height: 56px; object-fit: contain; border-radius: 8px;
      pointer-events: none;
    }
    .drop-zone .shape-item .shape-img { width: 38px; height: 38px; }

    /* ── 設定按鈕 ── */
    .btn-settings {
      position: absolute; top: 18px; right: 18px;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%; width: 44px; height: 44px;
      font-size: 1.2rem; cursor: pointer; color: #fff;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .btn-settings:hover { background: rgba(255,255,255,0.22); }

    /* ── 設定覆蓋層 ── */
    .settings-overlay {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(0,8,24,0.88); overflow-y: auto;
      padding: 24px 16px 40px;
      -webkit-overflow-scrolling: touch;
    }
    .settings-overlay.active { display: block; }
    .settings-box {
      background: #001a38; border: 1px solid rgba(72,202,228,0.3);
      border-radius: 20px; max-width: 580px; margin: 0 auto; padding: 26px 22px;
    }
    .settings-box h2 { color: #48cae4; font-size: 1.2rem; margin-bottom: 6px; }
    .settings-intro {
      color: rgba(255,255,255,0.5); font-size: 0.83rem;
      line-height: 1.65; margin-bottom: 20px;
    }
    .settings-intro a { color: #48cae4; }
    .settings-group { margin-bottom: 18px; }
    .settings-group-title {
      font-size: 0.8rem; letter-spacing: 1px; color: rgba(255,255,255,0.35);
      text-transform: uppercase; margin-bottom: 8px; padding-bottom: 4px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .settings-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .settings-row label {
      width: 52px; font-size: 0.85rem; color: #90e0ef; flex-shrink: 0;
      text-align: right;
    }
    .settings-row input[type="text"] {
      flex: 1; background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px; color: #fff; padding: 8px 10px;
      font-size: 0.82rem; outline: none;
      -webkit-appearance: none;
    }
    .settings-row input[type="text"]:focus { border-color: #48cae4; }
    .settings-row input[type="text"]::placeholder { color: rgba(255,255,255,0.25); }
    .settings-row .thumb-preview {
      width: 36px; height: 36px; border-radius: 6px; object-fit: cover;
      flex-shrink: 0; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .settings-actions {
      display: flex; gap: 10px; justify-content: flex-end;
      margin-top: 22px; flex-wrap: wrap;
    }
    .btn-save-settings {
      padding: 11px 30px; border: none; border-radius: 50px;
      background: linear-gradient(90deg, #0077b6, #00b4d8);
      color: #fff; font-weight: bold; cursor: pointer; font-size: 0.95rem;
      letter-spacing: 1px;
    }
    .btn-cancel-settings {
      padding: 11px 22px; border: 1px solid rgba(255,255,255,0.25);
      border-radius: 50px; background: transparent;
      color: rgba(255,255,255,0.7); cursor: pointer; font-size: 0.9rem;
    }
    .btn-clear-settings {
      padding: 11px 22px; border: 1px solid rgba(255,80,80,0.4);
      border-radius: 50px; background: transparent;
      color: #ff8fa0; cursor: pointer; font-size: 0.9rem;
    }
    .settings-status {
      font-size: 0.8rem; color: #43e97b; text-align: center;
      margin-top: 10px; min-height: 20px;
    }
  </style>
</head>
<body>

<div id="drag-ghost"></div>

<!-- ════ Google Drive 設定覆蓋層 ════ -->
<div id="settings-overlay" class="settings-overlay">
  <div class="settings-box">
    <h2>⚙️ 圖片設定（Google Drive）</h2>
    <p class="settings-intro">
      將 Google Drive 中的生物圖片設定到遊戲裡。<br>
      步驟：在 Drive 開啟圖片 → 點「共用」→ 設為「知道連結的人」→ 複製連結貼入下方。<br>
      留空則使用預設 SVG 圖示。設定儲存於此裝置的瀏覽器。
    </p>
    <div id="settings-form"></div>
    <div class="settings-actions">
      <button class="btn-clear-settings" onclick="clearAllDriveImages()">清除全部</button>
      <button class="btn-cancel-settings" onclick="closeSettings()">取消</button>
      <button class="btn-save-settings" onclick="saveSettings()">儲存設定</button>
    </div>
    <div class="settings-status" id="settings-status"></div>
  </div>
</div>

<!-- ════ 開場畫面 ════ -->
<div id="screen-start" class="screen active" style="position:relative;">
  <h1>🌊 海洋生物分類挑戰</h1>
  <div class="subtitle">Marine Life Sorting Challenge</div>
  <div class="start-previews">
    <!-- 魚類代表：小丑魚 -->
    <svg width="58" height="58" viewBox="0 0 60 60">
      <polygon points="50,30 59,19 59,41" fill="#d84315"/>

    <!-- 甲殼類代表：螃蟹 -->
    <svg width="58" height="58" viewBox="0 0 60 60">
      <line x1="16" y1="36" x2="3" y2="28" stroke="#b71c1c" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="14" y1="40" x2="2" y2="40" stroke="#b71c1c" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="14" y1="44" x2="4" y2="52" stroke="#b71c1c" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="44" y1="36" x2="57" y2="28" stroke="#b71c1c" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="46" y1="40" x2="58" y2="40" stroke="#b71c1c" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="46" y1="44" x2="56" y2="52" stroke="#b71c1c" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M12,30 Q4,20 6,12" stroke="#c62828" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="8" cy="9" rx="7" ry="5" fill="#c62828" transform="rotate(-30 8 9)"/>

    <!-- 棘皮動物代表：海星 -->
    <svg width="58" height="58" viewBox="0 0 60 60">
      <polygon points="30,4 35,22 54,22 39,33 44,51 30,40 16,51 21,33 6,22 25,22" fill="#ff8f00"/>

    <!-- 軟體動物代表：章魚 -->
    <svg width="58" height="58" viewBox="0 0 60 60">
      <path d="M14,38 Q6,48 8,57" stroke="#ba68c8" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M22,42 Q16,52 18,59" stroke="#ce93d8" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M30,44 Q28,54 26,59" stroke="#ba68c8" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M38,42 Q44,52 42,59" stroke="#ce93d8" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M46,38 Q54,48 52,57" stroke="#ba68c8" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="30" cy="18" rx="20" ry="16" fill="#9c27b0"/>
      <ellipse cx="30" cy="36" rx="18" ry="8" fill="#8e24aa"/>
      <circle cx="22" cy="18" r="6" fill="white"/><circle cx="22" cy="18" r="4" fill="#1a1a1a"/><circle cx="22" cy="18" r="1.5" fill="white"/>
      <circle cx="38" cy="18" r="6" fill="white"/><circle cx="38" cy="18" r="4" fill="#1a1a1a"/><circle cx="38" cy="18" r="1.5" fill="white"/>
    </svg>
  </div>
  <p>畫面中有 <strong>12 種海洋生物</strong>，<br>請把牠們拖曳到正確的分類框中！<br>完成後按下「送出答案」，查看結果與介紹。</p>
  <button class="btn-start" onclick="startGame()">開始遊戲</button>
  <button class="btn-settings" onclick="openSettings()" title="設定 Google Drive 圖片">⚙️</button>
</div>

<!-- ════ 遊戲畫面 ════ -->
<div id="screen-game" class="screen">
  <div class="game-header">
    <div class="game-title">🌊 海洋生物分類挑戰</div>
    <div class="progress-info" id="progress-text">已分類：0 / 12</div>
  </div>
  <div class="items-panel" id="items-panel">
    <div class="items-panel-label">— 待分類生物，請拖曳到下方框格 —</div>
  </div>
  <div class="drop-zones" id="drop-zones"></div>
  <button class="btn-submit" id="btn-submit" disabled onclick="submitAnswer()">送出答案</button>
</div>

<!-- ════ 結果畫面 ════ -->
<div id="screen-result" class="screen">
  <div class="result-score-big" id="result-score"></div>
  <div class="result-subtitle" id="result-subtitle"></div>
  <div class="result-list" id="result-list"></div>
  <div class="result-msg" id="result-msg"></div>
  <button class="btn-restart" onclick="restartGame()">再玩一次</button>
</div>

<script>
// ══════════════════════════════════════════════
// Google Drive 圖片整合
// ══════════════════════════════════════════════
const DRIVE_STORAGE_KEY = 'marine_game_drive_images';
let driveRaw    = {};  // { shapeId: 原始貼入的 Drive URL }
let driveImages = {};  // { shapeId: 可用於 <img src> 的縮圖 URL }

function parseDriveUrl(raw) {
  if (!raw) return '';
  raw = raw.trim();
  // https://drive.google.com/file/d/FILE_ID/view?...
  let m = raw.match(/\/file\/d\/([^/?#]+)/);
  if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w300`;
  // https://drive.google.com/open?id=FILE_ID  或 ?id=...
  m = raw.match(/[?&]id=([^&#]+)/);
  if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w300`;
  // https://drive.google.com/thumbnail?id=...（已是縮圖 URL，直接使用）
  if (raw.includes('drive.google.com/thumbnail')) return raw;
  // 其他以 https:// 開頭的 URL 直接當圖片用
  if (/^https?:\/\//.test(raw)) return raw;
  return '';
}

function loadDriveImages() {
  try {
    driveRaw = JSON.parse(localStorage.getItem(DRIVE_STORAGE_KEY) || '{}');
  } catch (e) { driveRaw = {}; }
  driveImages = {};
  Object.entries(driveRaw).forEach(([id, url]) => {
    const thumb = parseDriveUrl(url);
    if (thumb) driveImages[id] = thumb;
  });
}

function buildSettingsForm() {
  const form = document.getElementById('settings-form');
  form.innerHTML = '';
  const groups = [
    { id: 'fish',       label: '🐟 魚類',     ids: ['s1','s2','s3'] },
    { id: 'crustacean', label: '🦀 甲殼類',   ids: ['s4','s5','s6'] },
    { id: 'echinoderm', label: '⭐ 棘皮動物', ids: ['s7','s8','s9'] },
    { id: 'mollusc',    label: '🐙 軟體動物', ids: ['s10','s11','s12'] },
  ];
  groups.forEach(g => {
    const grpDiv = document.createElement('div');
    grpDiv.className = 'settings-group';
    grpDiv.innerHTML = `<div class="settings-group-title">${g.label}</div>`;
    g.ids.forEach(sid => {
      const shape = SHAPES.find(s => s.id === sid);
      if (!shape) return;
      const row = document.createElement('div');
      row.className = 'settings-row';
      const currentRaw = driveRaw[sid] || '';
      const thumbUrl   = driveImages[sid] || '';
      row.innerHTML = `
        <label for="di-${sid}">${shape.name}</label>
        <input type="text" id="di-${sid}" placeholder="貼入 Google Drive 共享連結"
               value="${escHtml(currentRaw)}">
        <img class="thumb-preview" id="tp-${sid}"
             src="${escHtml(thumbUrl)}"
             style="${thumbUrl ? '' : 'display:none'}"
             onerror="this.style.display='none'" alt="">
      `;
      grpDiv.appendChild(row);
      row.querySelector(`#di-${sid}`).addEventListener('input', e => onDriveInputChange(sid, e.target.value));
    });
    form.appendChild(grpDiv);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function onDriveInputChange(shapeId, raw) {
  const thumb = parseDriveUrl(raw);
  const preview = document.getElementById(`tp-${shapeId}`);
  if (preview) {
    if (thumb) {
      preview.src = thumb;
      preview.style.display = '';
    } else {
      preview.style.display = 'none';
    }
  }
}

function openSettings() {
  loadDriveImages();
  buildSettingsForm();
  document.getElementById('settings-status').textContent = '';
  document.getElementById('settings-overlay').classList.add('active');
}

function closeSettings() {
  document.getElementById('settings-overlay').classList.remove('active');
}

function saveSettings() {
  const newRaw = {};
  SHAPES.forEach(shape => {
    const input = document.getElementById(`di-${shape.id}`);
    if (input && input.value.trim()) newRaw[shape.id] = input.value.trim();
  });
  driveRaw = newRaw;
  localStorage.setItem(DRIVE_STORAGE_KEY, JSON.stringify(driveRaw));
  loadDriveImages();
  const count = Object.keys(driveImages).length;
  document.getElementById('settings-status').textContent =
    count > 0 ? `✓ 已儲存，${count} 種生物套用 Drive 圖片` : '✓ 已儲存（使用預設 SVG 圖示）';
  setTimeout(closeSettings, 1200);
}

function clearAllDriveImages() {
  SHAPES.forEach(shape => {
    const input = document.getElementById(`di-${shape.id}`);
    if (input) input.value = '';
    const preview = document.getElementById(`tp-${shape.id}`);
    if (preview) preview.style.display = 'none';
  });
  document.getElementById('settings-status').textContent = '已清除所有圖片設定（尚未儲存）';
}

// ══════════════════════════════════════════════
// 遊戲狀態
// ══════════════════════════════════════════════
let placement = {};
let shuffled  = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ══════════════════════════════════════════════
// 畫面切換
// ══════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ══════════════════════════════════════════════
// 開始遊戲
// ══════════════════════════════════════════════
function startGame() {
  placement = {};
  shuffled  = shuffle(SHAPES);
  buildGameScreen();
  showScreen('screen-game');
}

function buildGameScreen() {
  const panel = document.getElementById('items-panel');
  panel.innerHTML = '<div class="items-panel-label">— 待分類生物，請拖曳到下方框格 —</div>';
  shuffled.forEach(shape => panel.appendChild(createShapeEl(shape)));

  const zonesEl = document.getElementById('drop-zones');
  zonesEl.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const zone = document.createElement('div');
    zone.className = 'drop-zone';
    zone.dataset.catId = cat.id;
    zone.style.borderColor = cat.color + '55';
    zone.innerHTML = `
      <div class="zone-label" style="background:${cat.color}33;color:${cat.color}">${cat.label}</div>
      <div class="zone-content" id="zone-${cat.id}"></div>
    `;
    addDropZoneEvents(zone);
    zonesEl.appendChild(zone);
  });

  updateProgress();
}

function createShapeEl(shape) {
  const el = document.createElement('div');
  el.className = 'shape-item';
  el.dataset.shapeId = shape.id;
  el.innerHTML = shape.svg + `<span class="shape-label">${shape.name}</span>`;

  const imgUrl = driveImages[shape.id];
  if (imgUrl) {
    const img = document.createElement('img');
    img.src = imgUrl;
    img.className = 'shape-img';
    img.alt = shape.name;
    const svgEl = el.querySelector('svg');
    img.addEventListener('load',  () => { if (svgEl) svgEl.style.display = 'none'; });
    img.addEventListener('error', () => img.remove());
    el.insertBefore(img, el.firstChild);
  }

  el.title = shape.name;
  addDragEvents(el);
  return el;
}

// ══════════════════════════════════════════════
// 進度
// ══════════════════════════════════════════════
function updateProgress() {
  const count = Object.keys(placement).length;
  document.getElementById('progress-text').textContent = `已分類：${count} / ${SHAPES.length}`;
  document.getElementById('btn-submit').disabled = count < SHAPES.length;
}

// ══════════════════════════════════════════════
// Drag & Drop（滑鼠 + 觸控統一方案）
// ══════════════════════════════════════════════
let draggingId   = null;
let dragOriginEl = null;
let ghost        = document.getElementById('drag-ghost');

function addDragEvents(el) {
  el.addEventListener('mousedown',  onPointerDown);
  el.addEventListener('touchstart', onTouchStart, { passive: false });
}

function onPointerDown(e) {
  if (e.button !== 0) return;
  startDrag(e.currentTarget, e.clientX, e.clientY);
  document.addEventListener('mousemove', onMouseMove);
  document.addEventListener('mouseup',   onMouseUp);
}
function onMouseMove(e) { moveGhost(e.clientX, e.clientY); }
function onMouseUp(e) {
  document.removeEventListener('mousemove', onMouseMove);
  document.removeEventListener('mouseup',   onMouseUp);
  endDrag(e.clientX, e.clientY);
}

function onTouchStart(e) {
  e.preventDefault();
  const t = e.touches[0];
  startDrag(e.currentTarget, t.clientX, t.clientY);
  document.addEventListener('touchmove', onTouchMove, { passive: false });
  document.addEventListener('touchend',  onTouchEnd);
}
function onTouchMove(e) {
  e.preventDefault();
  const t = e.touches[0];
  moveGhost(t.clientX, t.clientY);
}
function onTouchEnd(e) {
  document.removeEventListener('touchmove', onTouchMove);
  document.removeEventListener('touchend',  onTouchEnd);
  const t = e.changedTouches[0];
  endDrag(t.clientX, t.clientY);
}

function startDrag(el, cx, cy) {
  draggingId   = el.dataset.shapeId;
  dragOriginEl = el.parentElement;
  el.classList.add('dragging');
  ghost.innerHTML = el.outerHTML;
  ghost.style.display = 'block';
  moveGhost(cx, cy);
}
function moveGhost(cx, cy) {
  ghost.style.left = (cx - 40) + 'px';
  ghost.style.top  = (cy - 40) + 'px';
}
function endDrag(cx, cy) {
  ghost.style.display = 'none';
  const el = document.querySelector(`.shape-item[data-shape-id="${draggingId}"]`);
  if (el) el.classList.remove('dragging');

  const target = findDropZone(cx, cy);
  if (target) {
    const catId   = target.dataset.catId;
    const content = target.querySelector('.zone-content');
    removeFromZones(draggingId);
    const newEl = createShapeEl(SHAPES.find(s => s.id === draggingId));
    content.appendChild(newEl);
    const panelEl = document.querySelector(`#items-panel .shape-item[data-shape-id="${draggingId}"]`);
    if (panelEl) panelEl.remove();
    placement[draggingId] = catId;
  }

  draggingId   = null;
  dragOriginEl = null;
  updateProgress();
  clearDragOver();
}

function findDropZone(cx, cy) {
  for (const z of document.querySelectorAll('.drop-zone')) {
    const r = z.getBoundingClientRect();
    if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) return z;
  }
  return null;
}
function removeFromZones(shapeId) {
  document.querySelectorAll('.drop-zone .shape-item').forEach(el => {
    if (el.dataset.shapeId === shapeId) el.remove();
  });
  delete placement[shapeId];
}
function addDropZoneEvents(zone) {
  zone.addEventListener('mouseover',  () => zone.classList.add('drag-over'));
  zone.addEventListener('mouseleave', () => zone.classList.remove('drag-over'));
}
function clearDragOver() {
  document.querySelectorAll('.drop-zone.drag-over').forEach(z => z.classList.remove('drag-over'));
}

// ══════════════════════════════════════════════
// 送出答案
// ══════════════════════════════════════════════
function submitAnswer() {
  let correct = 0;
  const rows  = [];
  SHAPES.forEach(shape => {
    const userCat   = placement[shape.id] || null;
    const isCorrect = userCat === shape.category;
    if (isCorrect) correct++;
    const catLabel  = CATEGORIES.find(c => c.id === shape.category)?.label || '?';
    const userLabel = CATEGORIES.find(c => c.id === userCat)?.label || '未放置';
    rows.push({ shape, isCorrect, catLabel, userLabel });
  });
  buildResultScreen(correct, rows);
  showScreen('screen-result');
}

function buildResultScreen(correct, rows) {
  const total = SHAPES.length;
  const pct   = Math.round(correct / total * 100);

  document.getElementById('result-score').textContent = `${correct} / ${total}`;
  document.getElementById('result-subtitle').textContent =
    pct === 100 ? '🎉 全部答對，你是海洋生物專家！' :
    pct >= 70   ? '👍 答對大部分，非常厲害！' :
    pct >= 40   ? '💪 還有進步空間，再試一次！' :
                  '🔍 海洋生物好多元，多觀察幾次吧！';

  const list = document.getElementById('result-list');
  list.innerHTML = '';
  rows.forEach(r => {
    const div = document.createElement('div');
    div.className = `result-row ${r.isCorrect ? 'correct' : 'wrong'}`;
    const smallSvg = r.shape.svg.replace(/width="56"/g, 'width="36"').replace(/height="56"/g, 'height="36"');
    div.innerHTML = `
      <span class="r-icon">${r.isCorrect ? '✅' : '❌'}</span>
      <div class="r-svg">${smallSvg}</div>
      <div class="r-info">
        <div class="r-name">${r.shape.name}</div>
        <div class="r-desc">${r.shape.desc}</div>
      </div>
      <div class="r-ans">
        ${r.isCorrect
          ? `正確：${r.catLabel}`
          : `你選：${r.userLabel}<br>正確：${r.catLabel}`
        }
      </div>
    `;
    list.appendChild(div);
  });

  document.getElementById('result-msg').textContent =
    pct === 100 ? '太厲害了！每種海洋生物的特徵你都掌握得很好！' :
    pct >= 70   ? '大部分分類都正確，有幾種稍微混淆了，再加油！' :
    pct >= 40   ? '海洋生物種類繁多，容易搞混，多看幾次它們的特徵吧！' :
                  '沒關係，分類需要多練習，仔細看看每種生物的介紹再試一次！';
}

// ══════════════════════════════════════════════
// 重新開始
// ══════════════════════════════════════════════
function restartGame() {
  showScreen('screen-start');
}

loadDriveImages();
